name: Official source monitoring
on:
  schedule:
    - cron: '17 5 * * 1'       # Tier A: weekly, Monday 05:17 UTC
    - cron: '31 5 1 * *'       # Tier B: monthly, day 1 05:31 UTC
    - cron: '43 5 1 1,4,7,10 *' # Tier C: quarterly, 05:43 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: Monitoring tier; sources that are not due are always skipped
        type: choice
        options: [A, B, C, all]
        default: A
permissions:
  contents: write
  actions: read
concurrency:
  group: official-source-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install monitor dependencies
        run: python -m pip install -r scripts/monitor-requirements.txt
      - name: Verify offline monitoring guards
        run: python -m unittest discover -s tests -p test_source_monitor.py
      - name: Restore state and reviewed queue resolutions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/monitor_ci.py restore
      - name: Select due tier
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TIER: ${{ inputs.tier }}
        run: |
          python - <<'PY'
          import os
          if os.environ['EVENT']=='workflow_dispatch':
              value=os.environ['INPUT_TIER']
              tiers='A B C' if value=='all' else value
          else:
              tiers={'17 5 * * 1':'A','31 5 1 * *':'B','43 5 1 1,4,7,10 *':'C'}[os.environ['SCHEDULE']]
          if any(t not in {'A','B','C'} for t in tiers.split()):raise SystemExit('Invalid tier')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('MONITOR_TIERS='+tiers+'\n')
          PY
      - name: Check due official sources
        id: fetch
        continue-on-error: true
        run: python scripts/source_monitor.py run --tiers $MONITOR_TIERS --max-runtime-minutes 60 --metadata-only
      - name: Prepare safe public check metadata
        if: always() && steps.fetch.outcome != 'skipped'
        run: |
          python scripts/source_monitor.py public
          python scripts/monitor_ci.py prepare
      - name: Retain hashes and flags only
        if: always() && steps.fetch.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-source-monitor-state
          path: research/monitoring/export/
          retention-days: 90
          if-no-files-found: error
      - name: Commit queue to the dedicated monitoring branch
        if: always() && steps.fetch.outcome != 'skipped'
        run: python scripts/monitor_ci.py publish
      - name: Fail loudly on unhealthy or incomplete monitoring
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo '::error::Source monitoring failed or exceeded its budget. See latest-run-summary.json and the retained state artifact. No admissions data were changed.'
          exit 1
