name: Report a tracker correction
description: Tell us about a program or admissions detail that needs a correction.
title: "Correction: "
labels: ["data correction"]
body:
  - type: markdown
    attributes:
      value: "Please do not include personal or sensitive information. The tracker team reviews reports before changing published data."
  - type: input
    id: page
    attributes:
      label: Program or university page
      description: Paste the tracker URL or give the institution and program name.
      placeholder: https://italy-it-programs.vercel.app/programs/example/
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should be corrected?
      description: Describe the current wording and the correction you recommend.
    validations:
      required: true
  - type: input
    id: official_source
    attributes:
      label: Official source
      description: Link to the relevant university or government page.
    validations:
      required: true
  - type: input
    id: source_date
    attributes:
      label: When was the source checked?
      placeholder: YYYY-MM-DD
    validations:
      required: false
